name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch, but only when the frontend changes
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  # ...and allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # All build commands run inside the frontend/ subfolder
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Turns Pages on for this repo (source = GitHub Actions) if it isn't
      # already, so a fresh clone needs no manual Settings → Pages step.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Auto-derive the correct values for THIS repo/owner:
          #  - project site  (owner/omnibrandstudio) -> base "/omnibrandstudio"
          #  - user/org site (owner/owner.github.io)  -> base "/"
          SITE: https://${{ github.repository_owner }}.github.io
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}', github.event.repository.name) }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
