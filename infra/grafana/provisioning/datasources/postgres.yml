apiVersion: 1

datasources:
- name: PostgreSQL
  uid: omnibrand-postgres
  type: postgres
  access: proxy
  url: postgres:5432
  user: omnibrand
  # Local-dev: Grafana connects as the app user. The password is injected from the
  # grafana container env (POSTGRES_PASSWORD), which docker-compose sets from .env.
  # To harden later, create a read-only role and point this datasource at it.
  secureJsonData:
    password: $__env{POSTGRES_PASSWORD}
  jsonData:
    database: omnibrand
    sslmode: disable
    postgresVersion: 1600
    timescaledb: false
  editable: false
