groups:
- name: campaign_operations
  rules:

  - alert: CampaignGenerationSLABreach
    expr: histogram_quantile(0.95, rate(omnibrand_campaign_duration_seconds_bucket[5m])) > 180
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "p95 campaign generation exceeds 180s SLA"
      description: "p95 = {{ $value | humanizeDuration }} — check worker queue depth and LLM provider latency"

  - alert: CampaignQueueDepthHigh
    expr: omnibrand_queue_depth > 50
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Campaign task queue backing up"
      description: "Queue depth = {{ $value }} — consider scaling worker replicas"

  - alert: CampaignFailureRateHigh
    expr: >
      rate(omnibrand_campaigns_completed_total{status="failed"}[15m]) / (rate(omnibrand_campaigns_completed_total[15m]) + 0.001) > 0.2
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Campaign failure rate above 20%"
      description: "Failure rate = {{ $value | humanizePercentage }}"

  - alert: WorkerMetricsDown
    expr: up{job="omnibrand_worker"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Worker Prometheus endpoint is unreachable"
      description: "The worker process may have crashed"
