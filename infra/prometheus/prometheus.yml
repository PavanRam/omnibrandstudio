global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project: omnibrand

rule_files:
- "rules/campaign_alerts.yml"
- "rules/llm_alerts.yml"

scrape_configs:

# Application services
- job_name: omnibrand_api
  static_configs:
  - targets: [ "api:8000" ]
  metrics_path: /metrics

- job_name: omnibrand_worker
  static_configs:
  - targets: [ "worker:9091" ]
  metrics_path: /metrics

# Data-store exporters
- job_name: redis
  static_configs:
  - targets: [ "redis-exporter:9121" ]

- job_name: postgres
  static_configs:
  - targets: [ "postgres-exporter:9187" ]

# Qdrant exposes Prometheus natively
- job_name: qdrant
  static_configs:
  - targets: [ "qdrant:6333" ]
  metrics_path: /metrics

# Prometheus self-monitoring
- job_name: prometheus
  static_configs:
  - targets: [ "localhost:9090" ]
