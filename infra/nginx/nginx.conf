events {
    worker_connections 1024;
}

http {
    # Generate a unique request ID for every inbound request.
    # If the client already supplies X-Request-ID, keep it; otherwise create one.
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;          # Nginx built-in $request_id (16-byte hex)
    }

    upstream omnibrand_api {
        server api:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass         http://omnibrand_api;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # Trace correlation headers
            proxy_set_header   X-Request-ID       $req_id;
            add_header         X-Request-ID       $req_id  always;

            # CORS: expose X-Request-ID to browser clients
            add_header         Access-Control-Expose-Headers  "X-Request-ID"  always;
        }

        # Pass Prometheus scrape through (useful when Nginx sits in front)
        location /metrics {
            proxy_pass http://omnibrand_api;
        }
    }
}
