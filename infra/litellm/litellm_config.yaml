# Translation — pinned single-provider; never pooled (consistent model
# family required for reproducible quality-gate scoring across retries —
# unlike the pooled aliases above, rotating providers mid-retry-loop here
# would make the quality gate's pass/fail inconsistent across attempts).
# Switched to Claude Sonnet (2026-07-27, user request) after gemini-2.5-flash
# was confirmed live (campaign 019fa487) to fall into a repetition-
# degeneration loop on long marketing copy — e.g. "bleu"/"bleue" repeated
# 20+ times in one French email, verified via Helsinki-NLP's faithful
# back-translation round-trip (see next_tasks.md, translation quality
# investigation). Previously ran gemini-2.5-pro -> gemini-2.5-flash
# (2026-07-26, no-Pro-anywhere directive) before this.
- model_name: "translation-primary"
  litellm_params:
    model: "anthropic/claude-sonnet-4-6"
    api_key: "os.environ/ANTHROPIC_API_KEY"
# Alternative: pin back to Gemini if Sonnet translation quality/cost
# doesn't validate well.
# - model_name: "translation-primary"
#   litellm_params:
#     model: "gemini/gemini-2.5-flash"
#     api_key: "os.environ/GEMINI_API_KEY"

# Translation validator — reverse-translation / reference-translation
# fallback paths ONLY (pipeline/agents/translation.py: _back_translate and
# the reference-translation fallback in _run_translation_gate). Primary path
# for both is now Helsinki-NLP (HF Inference Providers, confirmed live) —
# this alias only fires if that HF call itself errors, not on every retry
# attempt, so — unlike translation-primary above — it's safe to pool across
# providers (2026-07-26, user request; gpt-4o swapped for gpt-5.4-mini here
# per the "no heavy models" directive from items 26/27).
- model_name: "translation-validator"
  litellm_params:
    model: "gemini/gemini-2.5-flash-lite"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "translation-validator-gemini-2.5-flash-lite" }
- model_name: "translation-validator"
  litellm_params:
    model: "gemini/gemini-3.5-flash-lite"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "translation-validator-gemini-3.5-flash-lite" }
- model_name: "translation-validator"
  litellm_params:
    model: "openai/gpt-5.4-mini"
    api_key: "os.environ/OPENAI_API_KEY"
  model_info: { id: "translation-validator-gpt-5.4-mini" }

router_settings:
  fallbacks:
  - { "responder-chat": [ "responder-chat-gemini" ] }
  - { "util-fast": [ "util-fast-gemini" ] }
  - { "brief-collector": [ "brief-collector-gemini" ] }
  - { "understanding": [ "understanding-gemini" ] }
  retry_policy:
    BadRequestError: { num_retries: 0 }
    RateLimitError: { num_retries: 3, retry_after: 60 }
    ServiceUnavailableError: { num_retries: 3 }

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  drop_params: true
  max_budget: 10.0
  budget_duration: "1d"
