  model_info: { id: "util-fast-gpt-4o-mini" }

# Pooled across all 4 Flash quota buckets — this is only ever hit as a
# fallback (see router_settings below), so max headroom matters more than
# picking "the best" single Flash tier.
- model_name: "util-fast-gemini"
  litellm_params:
    model: "gemini/gemini-2.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "util-fast-gemini-2.5-flash" }
- model_name: "util-fast-gemini"
  litellm_params:
    model: "gemini/gemini-2.5-flash-lite"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "util-fast-gemini-2.5-flash-lite" }
- model_name: "util-fast-gemini"
  litellm_params:
    model: "gemini/gemini-3.5-flash-lite"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "util-fast-gemini-3.5-flash-lite" }
- model_name: "util-fast-gemini"
  litellm_params:
    model: "gemini/gemini-3-flash"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "util-fast-gemini-3-flash" }

