model_list:
# Generation — premium (paid/enterprise tier). No Sonnet (2026-07-26, user
# request) — pooled across Claude Haiku + Gemini 3.5 Flash(-lite), with
# gpt-5.4-nano as a cheap OpenAI-family backup.
- model_name: "gen-premium"
  litellm_params:
    model: "anthropic/claude-haiku-4-5-20251001"
    api_key: "os.environ/ANTHROPIC_API_KEY"
  model_info: { id: "gen-premium-claude-haiku" }
- model_name: "gen-premium"
  litellm_params:
    # "Gemini 3.5 Flash" as requested — the only confirmed real ID in that
    # family is gemini-3.5-flash-lite (no plain non-lite "3.5 Flash" model
    # is currently verifiable); using -lite here. If a distinct plain
    # gemini-3.5-flash ID exists on your account, give me the exact string
    # and this is a one-line swap.
    model: "gemini/gemini-3.5-flash-lite"
    api_key: "os.environ/GEMINI_API_KEY"
  model_info: { id: "gen-premium-gemini-3.5-flash-lite" }
- model_name: "gen-premium"
  litellm_params:
    model: "openai/gpt-5.4-nano"
    api_key: "os.environ/OPENAI_API_KEY"
  model_info: { id: "gen-premium-gpt-5.4-nano" }

# Generation — free tier (Groq Llama)
- model_name: "gen-free"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "gen-free-groq" }

# Judges — pinned by family (never change family on fallback). Single
# deployment per judge (2026-07-26, user request), not pooled — reinforces
# the pinning philosophy rather than working against it, and keeps each
# judge's scoring behavior stable/predictable rather than varying by which
# pool member happened to answer.
#   judge-1 → Anthropic family, judge-2 → OpenAI family, judge-3 → Gemini
#   family. No Sonnet/heavy-tier models in any of the three.
# judge-2 swapped off gpt-5.4-mini to Gemini 3.5 Flash (2026-07-27, user
# request) — GPT-4o/gpt-5.4-mini was the sole factual_grounding rejector
# across 4 consecutive live campaigns (including one deliberately
# conservative prompt with no unverifiable claims at all), consistently
# overriding 2/3 judge consensus and mean scores of 0.79-0.86/1.0 via the
# any-critical-violation override. NOTE: this now means judge-2 and judge-3
# are both Gemini family, losing the cross-family diversity this panel was
# designed around (see comment above and judge-3 below) — an explicit,
# accepted tradeoff for now, not an oversight.
- model_name: "judge-1"
  litellm_params:
    model: "anthropic/claude-haiku-4-5-20251001"
    api_key: "os.environ/ANTHROPIC_API_KEY"

- model_name: "judge-2"
  litellm_params:
    model: "gemini/gemini-3.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

# judge-3 — see gen-premium's comment above re: "Gemini 3.5 Flash" mapping
# to gemini-3.5-flash-lite (only confirmed real ID in that family).
- model_name: "judge-3"
  litellm_params:
    model: "gemini/gemini-3.5-flash-lite"
    api_key: "os.environ/GEMINI_API_KEY"

# Free-tier judge panel (Groq) — three DISTINCT families for cross-family
# disagreement signal, no paid spend. Selected when JUDGE_TIER=free.
#   judge-1-free → GPT-OSS family   (lead)
#   judge-2-free → Llama family     (diversity)
#   judge-3-free → Qwen family      (open-source check, pinned, no cross-family fallback)
- model_name: "judge-1-free"
  litellm_params:
    model: "groq/openai/gpt-oss-120b"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-1-free-gptoss" }
- model_name: "judge-1-free"
  litellm_params:
    model: "groq/openai/gpt-oss-20b"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "judge-2-free"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-2-free-llama" }
- model_name: "judge-2-free"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "judge-3-free"
  litellm_params:
    model: "groq/qwen/qwen3-32b"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-3-free-qwen" }

# Utility — cheap model for classification, summarisation. Pooled across
# both mini tiers (2026-07-26, user request: no heavy models anywhere).
- model_name: "util-fast"
  litellm_params:
    model: "openai/gpt-5.4-mini"
    api_key: "os.environ/OPENAI_API_KEY"
