model_list:
# Generation — premium (paid/enterprise tier)
- model_name: "gen-premium"
  litellm_params:
    model: "anthropic/claude-sonnet-4-6"
    api_key: "os.environ/ANTHROPIC_API_KEY"
  model_info: { id: "gen-premium-claude" }
- model_name: "gen-premium"
  litellm_params:
    model: "openai/gpt-4o-2024-11-20"
    api_key: "os.environ/OPENAI_API_KEY"

# Generation — free tier (Groq Llama)
- model_name: "gen-free"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "gen-free-groq" }

# Judges — pinned by family (never change family on fallback)
- model_name: "judge-1"
  litellm_params:
    model: "anthropic/claude-sonnet-4-6"
    api_key: "os.environ/ANTHROPIC_API_KEY"

- model_name: "judge-2"
  litellm_params:
    model: "openai/gpt-4o-2024-11-20"
    api_key: "os.environ/OPENAI_API_KEY"

# judge-3 (paid panel) — was groq/llama-3.2-90b-vision-preview (DECOMMISSIONED
# by Groq). Repointed to a currently-serveable Groq model so the paid panel
# still has a distinct open-source family judge.
- model_name: "judge-3"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"

# Free-tier judge panel (Groq) — three DISTINCT families for cross-family
# disagreement signal, no paid spend. Selected when JUDGE_TIER=free.
#   judge-1-free → GPT-OSS family   (lead)
#   judge-2-free → Llama family     (diversity)
#   judge-3-free → Qwen family      (open-source check, pinned, no cross-family fallback)
- model_name: "judge-1-free"
  litellm_params:
    model: "groq/openai/gpt-oss-120b"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-1-free-gptoss" }
- model_name: "judge-1-free"
  litellm_params:
    model: "groq/openai/gpt-oss-20b"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "judge-2-free"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-2-free-llama" }
- model_name: "judge-2-free"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "judge-3-free"
  litellm_params:
    model: "groq/qwen/qwen3-32b"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-3-free-qwen" }

# Utility — cheap model for classification, summarisation
- model_name: "util-fast"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "util-fast-gemini"
  litellm_params:
    model: "gemini/gemini-1.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

# Brief collector — dedicated extraction model for chat slot filling
- model_name: "brief-collector"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "brief-collector-gemini"
  litellm_params:
    model: "gemini/gemini-1.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

# Understanding — merged intent classification + brief extraction (JSON-strong)
- model_name: "understanding"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "understanding-gemini"
  litellm_params:
    model: "gemini/gemini-2.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

# Responder — high quality conversational turn generation
- model_name: "responder-chat"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"

- model_name: "responder-chat-gemini"
  litellm_params:
    model: "gemini/gemini-2.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

# Evaluation
- model_name: "eval-model"
  litellm_params:
    model: "anthropic/claude-haiku-4-5"
    api_key: "os.environ/ANTHROPIC_API_KEY"

# Embeddings
- model_name: "embedding"
  litellm_params:
    model: "openai/text-embedding-3-small"
    api_key: "os.environ/OPENAI_API_KEY"

# Translation — pinned single-provider; never pooled (consistent model
# family required for reproducible quality-gate scoring across retries).
#
# DEV MODE: using free-tier Groq model to avoid Anthropic spend during
# local/dev validation. SWITCH TO ANTHROPIC BEFORE PROD: comment out the
# Groq block below and uncomment the Anthropic block once translation
# quality needs to be validated against the real target model, or before
# any production deploy.
- model_name: "translation-primary"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
# - model_name: "translation-primary"
#   litellm_params:
#     model: "anthropic/claude-sonnet-4-6"
#     api_key: "os.environ/ANTHROPIC_API_KEY"

router_settings:
  fallbacks:
  - { "responder-chat": [ "responder-chat-gemini" ] }
  - { "util-fast": [ "util-fast-gemini" ] }
  - { "brief-collector": [ "brief-collector-gemini" ] }
  - { "understanding": [ "understanding-gemini" ] }
  retry_policy:
    BadRequestError: { num_retries: 0 }
    RateLimitError: { num_retries: 3, retry_after: 60 }
    ServiceUnavailableError: { num_retries: 3 }

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  drop_params: true
  max_budget: 10.0
  budget_duration: "1d"
