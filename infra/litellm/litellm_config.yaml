model_list:
# ============================================================================
# FREE TIER ALIASES (JUDGE_TIER=free)
# ============================================================================

# Used by content/personalization/reflexion generation path:
# - backend/pipeline/agents/content_generator.py
# - backend/pipeline/agents/personalization.py
# - backend/pipeline/agents/reflexion.py
- model_name: "gen-free"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "gen-free-groq" }

# Used by judge_claude when JUDGE_TIER=free:
# - backend/pipeline/agents/judges.py (alias key: judge-1)
- model_name: "judge-1-free"
  litellm_params:
    model: "groq/openai/gpt-oss-120b"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-1-free-gptoss" }
- model_name: "judge-1-free"
  litellm_params:
    model: "groq/openai/gpt-oss-20b"
    api_key: "os.environ/GROQ_API_KEY"

# Used by judge_gpt4o when JUDGE_TIER=free:
# - backend/pipeline/agents/judges.py (alias key: judge-2)
- model_name: "judge-2-free"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-2-free-llama" }
- model_name: "judge-2-free"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

# Used by judge_llama when JUDGE_TIER=free:
# - backend/pipeline/agents/judges.py (alias key: judge-3)
- model_name: "judge-3-free"
  litellm_params:
    model: "groq/qwen/qwen3-32b"
    api_key: "os.environ/GROQ_API_KEY"
  model_info: { id: "judge-3-free-qwen" }

# Used by chat understanding engine in free tier:
# - backend/services/chat/understanding_engine.py
- model_name: "understanding"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

# Used by chat responder in free tier:
# - backend/services/chat/conversation_responder.py
- model_name: "responder-chat"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"

# Used by high-volume utility/eval call paths:
# - backend/scripts/generate_golden_dataset.py (util-fast)
# - fallback target for free understanding/responder
- model_name: "util-fast"
  litellm_params:
    model: "groq/llama-3.1-8b-instant"
    api_key: "os.environ/GROQ_API_KEY"

# Used by ingestion quarantine and evaluation flows:
# - backend/services/rag/ingest.py (hardcoded eval-model)
- model_name: "eval-model"
  litellm_params:
    model: "anthropic/claude-haiku-4-5"
    api_key: "os.environ/ANTHROPIC_API_KEY"

# Used by translation agent unless overridden by model_aliases:
# - backend/pipeline/agents/translation.py
- model_name: "translation-primary"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"

# ============================================================================
# PAID TIER ALIASES (JUDGE_TIER=paid)
# ============================================================================

# Used by content/personalization/reflexion generation path:
# - backend/pipeline/initial_state.py (paid mapping)
- model_name: "gen-premium"
  litellm_params:
    model: "anthropic/claude-sonnet-4-6"
    api_key: "os.environ/ANTHROPIC_API_KEY"
  model_info: { id: "gen-premium-claude" }
- model_name: "gen-premium"
  litellm_params:
    model: "openai/gpt-4o-2024-11-20"
    api_key: "os.environ/OPENAI_API_KEY"

# Used by judge_claude when JUDGE_TIER=paid:
# - backend/pipeline/agents/judges.py (alias key: judge-1)
- model_name: "judge-1"
  litellm_params:
    model: "anthropic/claude-sonnet-4-6"
    api_key: "os.environ/ANTHROPIC_API_KEY"

# Used by judge_gpt4o when JUDGE_TIER=paid:
# - backend/pipeline/agents/judges.py (alias key: judge-2)
- model_name: "judge-2"
  litellm_params:
    model: "openai/gpt-4o-2024-11-20"
    api_key: "os.environ/OPENAI_API_KEY"

# Used by judge_llama when JUDGE_TIER=paid:
# - backend/pipeline/agents/judges.py (alias key: judge-3)
- model_name: "judge-3"
  litellm_params:
    model: "groq/llama-3.3-70b-versatile"
    api_key: "os.environ/GROQ_API_KEY"

# Used by chat understanding engine in paid tier:
# - backend/pipeline/initial_state.py maps understanding -> understanding-paid
- model_name: "understanding-paid"
  litellm_params:
    model: "openai/gpt-4o-mini"
    api_key: "os.environ/OPENAI_API_KEY"

# Used by chat responder in paid tier:
# - backend/pipeline/initial_state.py maps responder -> responder-chat-paid
- model_name: "responder-chat-paid"
  litellm_params:
    model: "openai/gpt-4o-2024-11-20"
    api_key: "os.environ/OPENAI_API_KEY"

# ============================================================================
# SHARED / RESERVED ALIASES
# ============================================================================

# Reserved for future LiteLLM-routed embeddings.
# NOTE: Current RAG path uses local embeddings in
# backend/services/rag/embeddings.py.
- model_name: "embedding"
  litellm_params:
    model: "openai/text-embedding-3-small"
    api_key: "os.environ/OPENAI_API_KEY"

# ============================================================================
# DEPRECATED / NOT WIRED (CONSERVATIVE KEEP)
# ============================================================================

# Not referenced by current runtime alias resolution. Retained temporarily for
# rollback safety and will be removed after deprecation window.
- model_name: "util-fast-gemini"
  litellm_params:
    model: "gemini/gemini-1.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

- model_name: "understanding-gemini"
  litellm_params:
    model: "gemini/gemini-2.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

- model_name: "responder-chat-gemini"
  litellm_params:
    model: "gemini/gemini-2.5-flash"
    api_key: "os.environ/GEMINI_API_KEY"

# Historical alternate translation provider (kept commented for migration docs)
# - model_name: "translation-primary"
#   litellm_params:
#     model: "anthropic/claude-sonnet-4-6"
#     api_key: "os.environ/ANTHROPIC_API_KEY"

router_settings:
  fallbacks:
  # Free tier fallbacks (Groq-only)
  - { "responder-chat": [ "util-fast" ] }
  - { "understanding": [ "util-fast" ] }

  # Paid tier fallbacks
  - { "responder-chat-paid": [ "responder-chat" ] }
  - { "understanding-paid": [ "understanding" ] }
  retry_policy:
    BadRequestError: { num_retries: 0 }
    RateLimitError: { num_retries: 3, retry_after: 60 }
    ServiceUnavailableError: { num_retries: 3 }

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  drop_params: true
  max_budget: 10.0
  budget_duration: "1d"
