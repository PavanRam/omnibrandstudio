[project]
name = "omnibrand"
version = "0.1.0"
description = "OmniBrand Studio — agentic content platform"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",

    # ai / llm
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "litellm>=1.55",
    "openai>=1.59",
    "anthropic>=0.42",

    # config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    # utilities
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "anyio>=4.7",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
