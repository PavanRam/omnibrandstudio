[project]
name = "omnibrand"
version = "0.1.0"
description = "OmniBrand Studio — agentic content platform"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",  # required by langgraph-checkpoint-postgres
    # cache / queue
    "redis[hiredis]>=5.2",
    # vector store
    "chromadb>=0.5",
    "pinecone>=5.0",
    # auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "passlib>=1.7",
    # ai / llm
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm>=1.55",
    "langfuse>=2,<3",
    "openai>=1.59",
    "anthropic>=0.42",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.6",
    "nltk>=3.9",
    "huggingface-hub>=1.22.0",
    "sacrebleu>=2.6.0",
    "tenacity>=9.1.4",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pandas>=2.2",
    "mcp>=1.9",
    # observability
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    # config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # utilities
    "python-dotenv>=1.0",
    "aiosmtplib>=3.0",
    "httpx>=0.28",
    "anyio>=4.7",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
    "types-passlib>=1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
